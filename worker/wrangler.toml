name = "oled-telegram"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"   # npx wrangler kv namespace create KV

[vars]
ALLOWED_USER_ID = "123456789"          # your numeric Telegram user id
CONVERTER_URL = "https://your-converter.onrender.com"

# Secrets (set with `npx wrangler secret put NAME`):
#   BOT_TOKEN, WEBHOOK_SECRET, DEVICE_KEY, CONVERTER_KEY
